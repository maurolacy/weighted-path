[package]
name = "weighted_path"
version = "0.1.0"
edition = "2024"


[[bin]]
name = "weighted_path"
path = "src/main.rs"

[[bin]]
name = "generate_graph"
path = "src/generate_graph.rs"

[dependencies]
fastrand = "2.0"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "dijkstra_bench"
harness = false
